; Produkční konfigurace PHP pro Konšel
date.timezone = Europe/Prague
memory_limit = 512M
max_execution_time = 60
max_input_time = 600
; zvukové záznamy zasedání až 500 MB na soubor, jedno odeslání může mít víc souborů
upload_max_filesize = 500M
post_max_size = 1024M
expose_php = Off

; chyby jen do logu (Tracy zapisuje do /app/log)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; kód se v kontejneru nemění – kontrola změn souborů není potřeba
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; relace ve svazku – přihlášení přežije nasazení nové verze
session.save_path = "/app/var/sessions"
session.gc_probability = 1
session.gc_divisor = 100
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
